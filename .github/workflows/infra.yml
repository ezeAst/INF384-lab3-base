name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        description: 'Autorizo que este plan destruya o reemplace recursos (acto humano explicito)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write        # para publicar el plan como comentario en el PR

env:
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: us-east-1
  TF_VERSION: '1.10.5'

jobs:

  # ---------------------------------------------------------------
  # B1 · Sintaxis e integridad: fmt, init, validate
  # ---------------------------------------------------------------
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - name: Init contra el backend remoto
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validacion
        run: terraform validate

  # ---------------------------------------------------------------
  # B2 · Politicas IaC (BLOQUEANTE desde HIGH)
  # ---------------------------------------------------------------
  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analisis de configuracion IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL      # a partir de esta severidad detiene
          exit-code: '1'
          format: table
          output: trivy-iac.txt

      - name: Publicar hallazgos
        if: always()
        run: |
          {
            echo "### Politicas IaC (Trivy) · detiene desde HIGH"
            echo
            echo '```'
            cat trivy-iac.txt 2>/dev/null || echo "sin reporte"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # B3 · Plan y compuerta sobre el plan
  # ---------------------------------------------------------------
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false      # sin wrapper para redirigir la salida limpia

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Calcular el plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > tfplan.json

      # Regla 2 va antes que la regla 1: el plan queda visible aunque la compuerta detenga.
      - name: Regla 2 · Publicar el plan en el resumen
        run: |
          {
            echo "### Plan de Terraform"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regla 2 · Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            const body = [
              '### Plan de Terraform',
              `Commit: \`${context.sha.substring(0, 7)}\``,
              '',
              '```',
              plan,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Regla 1 · Ninguna destruccion sin autorizacion
        env:
          # Solo un disparo manual con la casilla marcada autoriza. No viene del codigo ni del plan.
          AUTORIZADO: ${{ github.event_name == 'workflow_dispatch' && inputs.autorizar_destruccion }}
        run: |
          destruidos=$(jq -r '.resource_changes[]?
                              | select(.change.actions | index("delete"))
                              | "\(.address) [\(.change.actions | join(","))]"' tfplan.json)

          if [ -z "$destruidos" ]; then
            echo "### Regla 1: OK · el plan no destruye recursos" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$AUTORIZADO" = "true" ]; then
            echo "::warning::Destruccion autorizada manualmente por ${GITHUB_ACTOR}."
            {
              echo "### Regla 1: destruccion AUTORIZADA por ${GITHUB_ACTOR}"
              echo '```'
              echo "$destruidos"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$destruidos" | while read -r linea; do
            echo "::error::Destruccion no autorizada: ${linea}"
          done
          {
            echo "### Regla 1: DETENIDO · el plan destruye o reemplaza recursos"
            echo '```'
            echo "$destruidos"
            echo '```'
            echo 'Para autorizar: Actions > infra > Run workflow, marcando "autorizar_destruccion".'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Guardar el plan para aplicarlo sin recalcular
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          if-no-files-found: error

  # ---------------------------------------------------------------
  # B4 · Aplicacion del plan guardado
  # ---------------------------------------------------------------
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Descargar el plan guardado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Aplicar el plan guardado
        run: terraform apply -input=false tfplan
