name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

env:
  APLICACION: inf384-lab3
  AWS_REGION: us-east-1

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Gate 1: calidad (informativo)
  # ---------------------------------------------------------------
  calidad:
    needs: pruebas                # consume la cobertura del job pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo para detectar codigo nuevo

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/

      - name: Analisis en SonarQube Cloud
        id: sonar
        continue-on-error: true   # informativo: no detiene
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Publicar resultado
        if: always()
        run: |
          if [ "${{ steps.sonar.outcome }}" = "failure" ]; then
            echo "::warning::Quality Gate NO aprobado. Ver SonarQube Cloud."
          fi
          {
            echo "### Calidad (SonarQube Cloud): ${{ steps.sonar.outcome }}"
            echo
            echo "https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # Gate 2: secretos (BLOQUEANTE)
  # ---------------------------------------------------------------
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # codigo + historial completo

      - name: Buscar credenciales en codigo e historial
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Gate 3: dependencias (informativo)
  # ---------------------------------------------------------------
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulnerabilidades en el arbol completo del lock file
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'   # arbol completo, no solo produccion
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: table
          output: trivy-deps.txt
          exit-code: '0'                   # informativo

      - name: Publicar hallazgos
        run: |
          total=$(grep -cE 'CVE-|GHSA-' trivy-deps.txt || true)
          echo "::warning::Trivy: ${total} vulnerabilidad(es) en dependencias. Ver resumen."
          {
            echo "### Dependencias (Trivy): ${total} hallazgo(s)"
            echo
            echo '```'
            cat trivy-deps.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # Gate 4: estatico (informativo)
  # ---------------------------------------------------------------
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el codigo fuente
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
              --config=p/default \
              --config=p/javascript \
              --json --quiet \
              --output=semgrep.json \
              src/

      - name: Publicar hallazgos
        run: |
          total=$(jq '.results | length' semgrep.json)
          {
            echo "### Analisis estatico (Semgrep): ${total} hallazgo(s)"
            echo
            echo "| Regla | Ubicacion | Severidad |"
            echo "|---|---|---|"
            jq -r '.results[] | "| \(.check_id) | \(.path):\(.start.line) | \(.extra.severity) |"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "::warning file=\(.path),line=\(.start.line)::\(.check_id)"' semgrep.json

  # ---------------------------------------------------------------
  # Build y publicacion de la imagen
  # ---------------------------------------------------------------
  publicar:
    needs: [calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "imagen=${{ steps.ecr.outputs.registry }}/${APLICACION}" >> "$GITHUB_OUTPUT"

      - name: Construir la imagen
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --label org.opencontainers.image.title=${APLICACION} \
            -t ${{ steps.tags.outputs.imagen }}:${{ steps.tags.outputs.sha }} \
            .

      - name: Publicar con el tag sha
        run: docker push ${{ steps.tags.outputs.imagen }}:${{ steps.tags.outputs.sha }}

      - name: Apuntar el tag prd al mismo manifiesto
        run: |
          docker tag ${{ steps.tags.outputs.imagen }}:${{ steps.tags.outputs.sha }} \
                     ${{ steps.tags.outputs.imagen }}:prd
          docker push ${{ steps.tags.outputs.imagen }}:prd

      - name: Exponer el digest
        id: digest
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' \
                   ${{ steps.tags.outputs.imagen }}:${{ steps.tags.outputs.sha }})
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Imagen publicada"
            echo
            echo "| Tag | Imagen |"
            echo "|---|---|"
            echo "| sha | \`${{ steps.tags.outputs.imagen }}:${{ steps.tags.outputs.sha }}\` |"
            echo "| ambiente | \`${{ steps.tags.outputs.imagen }}:prd\` |"
            echo "| digest | \`${digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Este job viene completo y no se modifica.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
